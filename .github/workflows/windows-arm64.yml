name: Windows ARM64
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native-arm64:
    name: Native Windows ARM64 Tests
    runs-on: windows-11-arm
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.15.2
          use-cache: false
      - name: Build and package ARM64 binaries
        shell: pwsh
        run: |
          Add-Content src/main.zig 'comptime { @compileError("PKG35 deliberate ARM64 compile failure"); }'
          ./scripts/build-package-windows.ps1 -Version 0.0.1 -Architecture arm64 -Optimize ReleaseFast
